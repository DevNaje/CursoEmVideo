<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tabuada</h1>
    </header>
    <section>
        
        <!-- Tabuada -->
        <div>
            <p>Número: 
                <input type="number" name="num" id="txtn">
                <input type="button" value="Gerar Tabuada" class="btn" onclick="tabuada()">
                <input type="button" value="Limpar Número"  onclick="cleanTab()" class="btn">
            </p>
        </div>

        <div>
            <p name="tabuada" id="seltab" class="seltab" size="10"></p>
        </div>

        <!-- Raiz -->
        <div>
            <p>Número: 
                <input type="number" name="num" id="txtn2">
                <input type="button" value="Gerar Raiz" class="btn" onclick="raiz()">
                <input type="button" value="Limpar Número"  onclick="cleanRaiz()" class="btn">
            </p>
        </div>
        <option value="">
        </option>
        <div>
            <p name="RaizQuadrada" id="seltab2" class="seltab" size="1"></p>
        </div>

    </section>
    <footer>
            <p> &copy; Lucas dos Santos</p>
        </footer>
    <script src="script.js"></script>
</body>
</html>
